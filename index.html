<html>
  <body>

    <div id="icon" style="
      width:200px;
      height:200px;
      border-radius:50%;
      background:green;
      margin:200px auto;
    "></div>

    <p id="text"></p>

    <script>
      console.log("script loaded");

      setInterval(async () => {
        console.log("fetching...");

        const res = await fetch("http://localhost:8000/api/intrusion");
        const data = await res.json();

        console.log(data);

        const icon = document.getElementById("icon");
        const text = document.getElementById("text");

        if (data.intrusion) {
          icon.style.backgroundColor = "red";
          text.innerText = "침입이 감지되었습니다";
        } else {
          icon.style.backgroundColor = "green";
          text.innerText = "";
        }
      }, 2000);
    </script>

  </body>
</html>
